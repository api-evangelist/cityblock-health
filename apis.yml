description: Cityblock Health is a value-based healthcare provider delivering relationship-based
  primary care, behavioral and mental health support, social care services, urgent care, and
  hospital-to-home transitions to underserved and Medicaid-eligible communities. Care is coordinated
  by Community Health Partners who connect members with medical providers, therapists, clinical
  pharmacists, and social resources. Cityblock operates clinics across nine states plus Washington,
  D.C., working in partnership with health insurance plans. Backed by General Catalyst and Redpoint
  Ventures. No public developer API surface was found at the time of enrichment.
